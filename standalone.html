<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UGTBrowser</title>
  <style>
    /* Standalone page styles - minimal, let content script handle panel styling */
    :root {
      --primary-color: #4285f4;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f5f5f5;
      min-height: 100vh;
      padding: 20px;
    }
    
    .standalone-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--primary-color);
    }
    
    .standalone-header img {
      width: 32px;
      height: 32px;
    }
    
    .standalone-header h1 {
      color: var(--primary-color);
      font-size: 1.3rem;
      font-weight: 600;
    }
    
    /* Restricted page notice */
    .restricted-notice {
      display: none;
      align-items: flex-start;
      gap: 12px;
      background: linear-gradient(135deg, #fff8e6 0%, #fff3cd 100%);
      border: 1px solid #ffc107;
      border-left: 4px solid #ffc107;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 16px;
      position: relative;
    }
    
    .restricted-notice.visible {
      display: flex;
    }
    
    .notice-icon {
      font-size: 20px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    
    .notice-content {
      flex: 1;
    }
    
    .notice-content strong {
      display: block;
      color: #856404;
      font-size: 14px;
      margin-bottom: 4px;
    }
    
    .notice-content p {
      color: #664d03;
      font-size: 13px;
      line-height: 1.5;
      margin: 0;
    }
    
    .dismiss-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: none;
      border: none;
      font-size: 20px;
      color: #856404;
      cursor: pointer;
      padding: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: background-color 0.2s;
    }
    
    .dismiss-btn:hover {
      background-color: rgba(0, 0, 0, 0.1);
    }
    
    /* Container where content script will render panels */
    #standaloneContainer {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      min-height: 300px;
    }
    
    /* Override some content script panel styles for standalone mode */
    #standaloneContainer .ugt-lesson-container,
    #standaloneContainer .ugt-ask-container {
      margin: 0 !important;
      max-width: 100% !important;
      box-shadow: none !important;
    }
    
    .standalone-footer {
      margin-top: 16px;
      text-align: right;
    }
    
    .standalone-footer button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background-color: #e0e0e0;
      color: #333;
      transition: background-color 0.2s;
    }
    
    .standalone-footer button:hover {
      background-color: #d0d0d0;
    }
  </style>
</head>
<body>
  <div class="standalone-header">
    <img src="icon48.png" alt="UGTBrowser">
    <h1 id="pageTitle">UGTBrowser</h1>
  </div>
  
  <!-- Notice shown when opened because content couldn't be modified inline -->
  <div id="restrictedNotice" class="restricted-notice">
    <span class="notice-icon">ℹ️</span>
    <div class="notice-content">
      <strong>Why am I seeing this popup?</strong>
      <p>UGTBrowser couldn't modify the page directly. This happens on restricted pages (like other extensions' popups, browser internal pages), or if the page wasn't refreshed after installing the extension.</p>
    </div>
    <button id="dismissNotice" class="dismiss-btn" title="Dismiss">×</button>
  </div>
  
  <!-- Container where content script will render its panels -->
  <div id="standaloneContainer"></div>
  
  <div class="standalone-footer">
    <button id="closeButton">Close Window</button>
  </div>
  
  <!-- Initialize standalone mode first, then load content script -->
  <script src="standalone-init.js"></script>
  <script src="contentScript.js"></script>
</body>
</html>
